services:
  n8n:
    image: n8nio/n8n:2.0.3
    container_name: n8n-dev
    restart: unless-stopped
    ports:
      - "5678:5678"
    environment:
      - NODE_ENV=development
      - N8N_SECURE_COOKIE=false
      - N8N_USER_EMAIL=admin@example.com
      - N8N_USER_PASSWORD=supersecret
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      - DB_SQLITE_POOL_SIZE=5
      - N8N_RUNNERS_ENABLED=true
      - NODE_FUNCTION_ALLOW_EXTERNAL=*
      # n8n 2.x (pnpm packaging) no longer sets NODE_PATH, so custom nodes
      # mounted as bare ./dist cannot resolve the n8n-workflow peer dependency
      # and fail to load silently. Point NODE_PATH at n8n's own node_modules.
      - NODE_PATH=/usr/local/lib/node_modules/n8n/node_modules
      - WATCHFLOW_API_KEY=${WATCHFLOW_API_KEY}
      # Which Watchflow API to hit. Default production; set to
      # https://api.stage.watchflow.io in your .env to test against staging.
      - WATCHFLOW_BASE_URL=${WATCHFLOW_BASE_URL:-https://api.watchflow.io}
    volumes:
      - n8n_data:/home/node/.n8n
      - ./dist:/home/node/.n8n/custom/node_modules/@watchflow/n8n-nodes-watchflow
      - ./testWorkflows:/tmp/workflows:ro
      - ./docker-entrypoint.sh:/docker-entrypoint.sh:ro
    entrypoint: ["/bin/sh", "/docker-entrypoint.sh"]

volumes:
  n8n_data:
